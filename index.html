<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tech Govind</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    header {
      padding: 20px;
      background: #020617;
    }

    header h2 {
      color: #38bdf8;
    }

    nav {
      margin-top: 10px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
    }

    nav a:hover {
      color: #38bdf8;
    }

    .hero {
      padding: 120px 20px;
    }

    .hero h1 {
      font-size: 55px;
      margin-bottom: 20px;
    }

    .hero span {
      color: #38bdf8;
    }

    .hero p {
      color: #cbd5e1;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      padding: 12px 25px;
      background: #38bdf8;
      color: #020617;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .button:hover {
      background: #7dd3fc;
    }

    .about {
      padding: 70px 20px;
      background: #111827;
    }

    .about h2 {
      margin-bottom: 15px;
    }

    .about p {
      color: #94a3b8;
      max-width: 600px;
      margin: auto;
    }

    footer {
      padding: 20px;
      background: #020617;
      color: #64748b;
    }
  </style>
</head>

<body>

  <header>
    <h2>Tech Govind</h2>

    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
    </nav>
  </header>

  <section class="hero" id="home">

    <h1>
      Welcome to <span>Tech Govind</span>
    </h1>

    <p>
      Technology • Coding • AI • Innovation
    </p>

    <a href="#about" class="button">
      Learn More
    </a>

  </section>

  <section class="about" id="about">

    <h2>About Tech Govind</h2>

    <p>
      Tech Govind is a simple technology website
      focused on coding, artificial intelligence,
      web development and new technology.
    </p>

  </section>

  <footer>
    © 2026 Tech Govind
  </footer>

</body>
</html>
